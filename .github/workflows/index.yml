name: Katalog bauen
on:
  push:
    branches: [main]
    paths: ["templates/**", "tools/**"]
  pull_request:
    paths: ["templates/**", "tools/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Vorlagen prüfen
        run: python3 tools/build_index.py --check
      - name: index.json bauen und einchecken
        if: github.event_name == 'push'
        run: |
          python3 tools/build_index.py
          if ! git diff --quiet index.json; then
            git config user.name "daliegts-bot"
            git config user.email "bot@users.noreply.github.com"
            git add index.json
            git commit -m "Katalog aktualisiert"
            git push
          fi
